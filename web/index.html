<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Desk" />
    <meta name="description" content="RPRoom paper desk" />
    <title>RPRoom Desk</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <h1>RPRoom</h1>
        <span class="pill" id="mode-pill">PAPER</span>
      </header>
      <p id="status" class="status" role="status" aria-live="polite" hidden></p>
      <main>
        <section id="panel-home" role="tabpanel" aria-labelledby="tab-home">
          <p class="balance" id="balance">$200.00</p>
          <div class="stats">
            <p class="today" id="today">+0.00% today</p>
            <p class="mult" id="mult">1.00×</p>
          </div>
          <div class="card chart-card" id="chart-card">
            <p class="chart-empty" id="chart-empty">Waiting for the first trade</p>
            <canvas id="chart-canvas" hidden></canvas>
          </div>
          <h2 id="markets-label" hidden>Markets</h2>
          <div class="card" id="markets" hidden></div>
          <h2>Agents</h2>
          <div class="card is-empty" id="home-agents">
            <p class="empty">No agents yet</p>
          </div>
          <h2>Activity</h2>
          <div class="card is-empty" id="home-activity">
            <p class="empty">No activity yet</p>
          </div>
        </section>

        <section id="panel-agents" role="tabpanel" aria-labelledby="tab-agents" hidden>
          <h2>Agents</h2>
          <div class="card is-empty" id="agents-list">
            <p class="empty">No agents yet</p>
          </div>
        </section>

        <section id="panel-activity" role="tabpanel" aria-labelledby="tab-activity" hidden>
          <h2>Activity</h2>
          <div class="card is-empty" id="activity-list">
            <p class="empty">No activity yet</p>
          </div>
        </section>

        <section id="panel-account" role="tabpanel" aria-labelledby="tab-account" hidden>
          <h2>Mode</h2>
          <article class="card note-card">
            <p class="mode-line"><span class="pill" id="account-pill">PAPER</span></p>
            <p class="note" id="mode-note">PAPER is read-only on this phone. Settings are changed in Telegram.</p>
          </article>
          <h2>FOMO</h2>
          <div id="account-links"></div>
        </section>
      </main>
      <nav class="tabs" role="tablist" aria-label="Desk">
        <button type="button" role="tab" id="tab-home" data-tab="home" aria-controls="panel-home" aria-selected="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4.5 10.4 12 4.2l7.5 6.2V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.2a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1V20.5H6A1.5 1.5 0 0 1 4.5 19v-8.6Z" />
          </svg>
          Home
        </button>
        <button type="button" role="tab" id="tab-agents" data-tab="agents" aria-controls="panel-agents" aria-selected="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8.2 11.2a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2Zm7.6.6a2.2 2.2 0 1 1 0-4.4 2.2 2.2 0 0 1 0 4.4ZM4.6 18.8v-.7c0-2 1.8-3.4 4.2-3.4 2.3 0 4.1 1.4 4.2 3.4v.7H4.6Zm7.3 0v-.8c0-.5.1-1 .3-1.4 0-.1.1-.2.2-.3.8-1 2.1-1.6 3.6-1.6 2 0 3.6 1.2 3.6 3.1v1H11.9Z" />
          </svg>
          Agents
        </button>
        <button type="button" role="tab" id="tab-activity" data-tab="activity" aria-controls="panel-activity" aria-selected="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 6.5h14v1.8H5V6.5Zm0 4.6h14v1.8H5v-1.8Zm0 4.6h9.2V17.5H5v-1.8Z" />
          </svg>
          Activity
        </button>
        <button type="button" role="tab" id="tab-account" data-tab="account" aria-controls="panel-account" aria-selected="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 12.2a3.3 3.3 0 1 1 0-6.6 3.3 3.3 0 0 1 0 6.6ZM6.2 18.6v-.6c0-2.3 2.4-4 5.8-4s5.8 1.7 5.8 4v.6H6.2Z" />
          </svg>
          Account
        </button>
      </nav>
    </div>
    <noscript>
      <p class="noscript">JavaScript is required to refresh the desk.</p>
    </noscript>
    <script type="module" src="app.js"></script>
  </body>
</html>
